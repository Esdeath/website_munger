name: Sync production branch

# Cloudflare Pages 的 production branch 配的是 master，而仓库用 main。
# 每次 main 更新后把同一个提交同步到 master，避免只生成 preview 部署。
# 更彻底的修法是在 Cloudflare Pages 设置里把 production branch 改成 main，
# 然后删除这个 workflow 和 master 分支。
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to master
        run: git push origin HEAD:master
